<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Console</title>

<!-- Ace Editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/mode-yaml.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/theme-tomorrow_night.min.js"></script>

<link rel="stylesheet" href="admin.css">
</head>

<body>

<div id="loginOverlay" style="
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
">

  <div style="
    background:#fff;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    text-align:center;
    width:300px;
  ">

    <h3>Admin Login</h3>

    <input
      type="password"
      id="adminPassword"
      placeholder="Enter Password"
      style="
        width:100%;
        padding:10px;
        margin:15px 0;
        box-sizing:border-box;
      "
    >

    <button onclick="loginAdmin()">
      Login
    </button>

    <p id="loginError" style="color:red;"></p>

  </div>

</div>

<script>

async function loginAdmin() {

  const password =
    document.getElementById("adminPassword").value;

  const response = await fetch('/admin/login', {
    method:'POST',
    headers:{
      'Content-Type':'application/json'
    },
    body:JSON.stringify({
      password
    })
  });

  if(response.ok){

    document.getElementById("loginOverlay")
      .style.display = "none";

  } else {

    document.getElementById("loginError")
      .innerText = "Invalid Password";

    document.getElementById("adminPassword")
      .value = "";

  }
}

document.getElementById("adminPassword")
.addEventListener("keypress", function(e){

  if(e.key === "Enter"){
    loginAdmin();
  }

});

</script>

checkPassword();

</script>


<div class="admin-container">
  <h1>Admin Console</h1>

  <!-- CONTENT EDITOR -->
  <div class="card">
    <div class="editor-header">
      <h2>Edit Page Content</h2>

      <!-- NAV TABS -->
      <div class="page-tabs">
	    <button class="tab active" data-page="layout">Layout</button>
        <button class="tab" data-page="homepage">Homepage</button>
        <button class="tab" data-page="aboutus">AboutUs</button>
        <button class="tab" data-page="products">Products</button>
        <button class="tab" data-page="gallery">Gallery</button>
        <button class="tab" data-page="services">Panchakarma</button>
        <button class="tab" data-page="videos">Videos</button>
		<button class="tab" data-page="panchakarma">Therapies</button>
		<button class="tab" data-page="readmore">Read More</button>
      </div>
    </div>

    <div id="editor"></div>
	
	<div class="editor-settings">
  <label>
    Font
    <select id="fontFamily">
      <option value="JetBrains Mono">JetBrains Mono</option>
      <option value="Fira Code">Fira Code</option>
      <option value="Courier New">Courier New</option>
      <option value="monospace">Monospace</option>
    </select>
  </label>

  <label>
    Font Size
    <select id="fontSize">
      <option>12</option>
      <option>13</option>
      <option>14</option>
      <option selected>15</option>
      <option>16</option>
      <option>18</option>
    </select>
  </label>

  <label>
    Theme
    <select id="theme">
      <option value="tomorrow_night">Dark</option>
      <option value="github">Light</option>
      <option value="monokai">Monokai</option>
    </select>
  </label>
</div>


    <br>
    <button class="primary" onclick="save()">Save & Build</button>
  </div>

  <!-- REVIEWS (Homepage only) -->
  <div class="card" id="reviewsCard">
    <h2>Pending Reviews</h2>
    <div id="reviews">Loading…</div>
  </div>

  <!-- IMAGE UPLOAD (Homepage only) -->
  <div class="card" id="uploadCard">
    <h2>Upload Image</h2>
    <div class="upload-row">
      <input type="file" id="image">
      <button class="primary" onclick="uploadImage()">Upload</button>
    </div>
    <p id="result"></p>
  </div>

  <!-- GALLERY UPLOAD (Gallery only) -->
  <div class="card" id="galleryCard">
    <h2>Gallery Upload</h2>
    <input type="file" id="galleryImage">
    <button class="primary" onclick="uploadGallery()">Upload to Gallery</button>
    <p id="galleryResult"></p>
  </div>

</div>

<script src="admin.js"></script>
</body>
</html>
