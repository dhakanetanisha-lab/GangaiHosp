<!-- TOP CAROUSEL -->

<section class="top-carousel">

  <div class="carousel-container">

    {{#each carousel.items}}

      <div class="carousel-slide {{#if @first}}active{{/if}}">

        <img src="{{this.image}}" alt="{{this.caption}}">

        <div class="carousel-overlay">
          <h2>{{this.caption}}</h2>
        </div>

      </div>

    {{/each}}

    <!-- DOTS -->

    <div class="carousel-dots">

      {{#each carousel.items}}
        <span class="carousel-dot {{#if @first}}active{{/if}}"></span>
      {{/each}}

    </div>

  </div>

</section>


<section class="gallery-section">
  <div class="gallery-grid">
    {{#each groups}}
      <figure class="gallery-card">
        
        <!-- GROUP CAPTION -->
        {{#if this.caption}}
          <figcaption class="group-caption">
            {{this.caption}}
          </figcaption>
        {{/if}}

        <!-- IMAGE LIST -->
        <div class="group-images">
          {{#each this.images}}
            <img 
              src="{{this}}" 
             alt="{{../caption}}"
              
            >
          {{/each}}
        </div>

      </figure>
    {{/each}}
  </div>
  

</section>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
  <span class="lightbox-close" onclick="closeLightbox()">&times;</span>

  <!-- PREVIOUS -->
  <button class="lightbox-prev" onclick="prevImage()">❮</button>

  <!-- IMAGE -->
  <img id="lightbox-img">

  <!-- NEXT -->
  <button class="lightbox-next" onclick="nextImage()">❯</button>

  <p id="lightbox-caption"></p>
</div>
<script>
document.addEventListener("DOMContentLoaded", function () {

  const galleryImages = document.querySelectorAll('.group-images img');

  let currentIndex = 0;

  // CLICK IMAGE → OPEN
  galleryImages.forEach((img, index) => {
    img.addEventListener('click', () => {
      currentIndex = index;
      showImage();
      document.getElementById('lightbox').style.display = 'flex';
    });
  });

  function showImage() {
    const img = galleryImages[currentIndex];
    document.getElementById('lightbox-img').src = img.src;
    document.getElementById('lightbox-caption').innerText = img.alt || '';
  }

  function nextImage() {
    currentIndex = (currentIndex + 1) % galleryImages.length;
    showImage();
  }

  function prevImage() {
    currentIndex = (currentIndex - 1 + galleryImages.length) % galleryImages.length;
    showImage();
  }

  function closeLightbox() {
    document.getElementById('lightbox').style.display = 'none';
  }

  // make buttons work
  window.nextImage = nextImage;
  window.prevImage = prevImage;
  window.closeLightbox = closeLightbox;

});



document.addEventListener("DOMContentLoaded", function () {

  const slides = document.querySelectorAll(".carousel-slide");
  const dots = document.querySelectorAll(".carousel-dot");

  let current = 0;

  function showSlide(index) {

    slides.forEach(slide => {
      slide.classList.remove("active");
    });

    dots.forEach(dot => {
      dot.classList.remove("active");
    });

    slides[index].classList.add("active");
    dots[index].classList.add("active");
  }

  function nextSlide() {

    current++;

    if (current >= slides.length) {
      current = 0;
    }

    showSlide(current);
  }

  /* AUTO SLIDE */

  setInterval(nextSlide, 3000);

  /* DOT CLICK */

  dots.forEach((dot, index) => {

    dot.addEventListener("click", function () {

      current = index;

      showSlide(current);

    });

  });

});

</script>

</script>
